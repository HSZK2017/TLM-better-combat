plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.29'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                tlm_smart_combat {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                tlm_smart_combat {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    // 本地依赖（fg.deobf 需要通过 flatDir 仓库解析才能反混淆）
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Touhou Little Maid 本体（编译期依赖，运行时由玩家安装）
    compileOnly fg.deobf("deps:touhou_little_maid:1.5.3")
    // 拔刀剑与 True POWER of Maid（可选联动，编译期依赖）
    compileOnly fg.deobf("deps:slashblade:1.9.65")
    compileOnly fg.deobf("deps:true_power_of_maid:1.2.3")
    // 容器管理（可选联动，编译期依赖，用于访问权检测）
    compileOnly fg.deobf("deps:maid_storage_manager:1.15.6")
}

jar {
    // Forge 1.20.1 通过 jar 清单中的 MixinConfigs 属性注册 mixin 配置
    manifest {
        attributes([
                'MixinConfigs': 'tlm_smart_combat.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

// 资源文件中替换版本号
processResources {
    def replaceProps = [
            "mod_version"    : mod_version,
            "mod_id"         : mod_id,
            "mod_name"       : mod_name,
            "mod_license"    : mod_license,
            "mod_authors"    : mod_authors,
            "mod_description": mod_description
    ]
    inputs.properties replaceProps
    filesMatching('META-INF/mods.toml') {
        expand replaceProps
    }
}
